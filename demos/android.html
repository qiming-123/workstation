<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>workstation — UI Demo（Android App）</title>
<style>
:root{
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#9c9ca1;
  --accent:#0a84ff; --danger:#ff453a;
  --line:rgba(0,0,0,.07);
  --radius-xl:24px; --radius-lg:18px; --radius-md:13px; --radius-pill:980px;
  --spring:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 16px;gap:20px;background:#101014;
  background:radial-gradient(80% 60% at 20% 0%,#1d2340 0%,transparent 60%),
             radial-gradient(70% 55% at 85% 20%,#2c1f3f 0%,transparent 60%),
             #101014;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.screen{animation:slideIn .38s var(--spring)}
.stagger>*{opacity:0;animation:fadeUp .5s var(--spring) forwards;animation-delay:var(--d,0ms)}
.pressable{transition:transform .22s var(--spring),opacity .2s ease}
.pressable:active{transform:scale(.96);opacity:.88}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.intro{text-align:center;max-width:440px;color:#f5f5f7}
.intro h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.intro p{font-size:13px;color:rgba(245,245,247,.55);margin-top:8px}
.badge-later{
  display:inline-block;font-size:10.5px;font-weight:600;color:#c9c2ff;background:rgba(94,92,230,.22);
  border:1px solid rgba(94,92,230,.45);padding:2px 10px;border-radius:var(--radius-pill);
  margin-left:8px;vertical-align:2px;
}
.badge-demo{
  font-size:10.5px;font-weight:600;color:#8a6d00;background:rgba(255,243,214,.95);
  border:1px solid rgba(240,223,174,.9);padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;
}

/* ---------- 手机框 ---------- */
.phone{
  width:min(380px,94vw);height:min(780px,84vh);
  background:#1a1a1e;border-radius:52px;padding:11px;
  box-shadow:0 40px 90px -18px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09),inset 0 0 0 1.5px rgba(255,255,255,.08);
}
.screen-box{
  position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;
  display:flex;flex-direction:column;background:#f2f2f7;
}
.screen-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.screen-bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.screen-bg i:nth-child(1){width:280px;height:280px;left:-90px;top:-110px;background:radial-gradient(circle,#a6c9ff,transparent 65%)}
.screen-bg i:nth-child(2){width:240px;height:240px;right:-80px;top:-30px;background:radial-gradient(circle,#d8ccff,transparent 65%)}
.screen-bg i:nth-child(3){width:260px;height:260px;left:60px;bottom:-150px;background:radial-gradient(circle,#ffd9ec,transparent 65%)}
.notch{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:108px;height:26px;background:#101014;border-radius:14px;z-index:6;
}

/* ---------- App 内部 ---------- */
.appbar{
  position:relative;z-index:2;
  padding:56px 20px 13px;display:flex;align-items:center;gap:8px;flex:none;
  background:rgba(242,242,247,.55);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.appbar .t{font-size:21px;font-weight:700;letter-spacing:-.02em;flex:1}
.back{color:var(--accent);font-size:15px;font-weight:500;padding:2px 6px;margin-left:-6px}
.content{position:relative;z-index:1;flex:1;overflow-y:auto;padding:16px 16px 100px}
.tabbar{
  position:absolute;left:12px;right:12px;bottom:14px;z-index:5;display:flex;
  background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 12px 32px -8px rgba(0,0,0,.18);
  border-radius:22px;padding:7px 10px;
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:500;padding:6px 0}
.tabbar button.on{color:var(--accent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#2f96ff,#0a6cf0);color:#fff;font-weight:600;font-size:15px;
  padding:13px 20px;border-radius:var(--radius-pill);width:100%;
  box-shadow:0 6px 16px -5px rgba(10,108,240,.55),inset 0 1px 0 rgba(255,255,255,.25);
}
.card{
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);
  border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 0.5px 1px rgba(0,0,0,.05),0 12px 32px -8px rgba(0,0,0,.09);
}
.h-sub{font-size:13px;color:var(--text-2)}

/* 登录屏 */
.login{padding:110px 30px 0;text-align:center;position:relative;z-index:1}
.login .logo{
  width:76px;height:76px;margin:0 auto 20px;border-radius:21px;
  background:linear-gradient(145deg,#3ea0ff,#0a5fff 55%,#5e5ce6);
  box-shadow:0 16px 36px -8px rgba(10,102,255,.55),inset 0 1.5px 2px rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
}
.login h2{font-size:23px;font-weight:700;letter-spacing:-.02em}
.login input{
  width:100%;padding:14px 17px;border-radius:var(--radius-md);border:1px solid var(--line);
  background:rgba(255,255,255,.85);outline:none;margin-top:24px;
  transition:border-color .2s,box-shadow .25s;
}
.login input:focus{border-color:var(--accent);box-shadow:0 0 0 4.5px rgba(10,132,255,.16)}
.login .btn{margin-top:15px}
.login .note{margin-top:18px;font-size:11px;color:var(--text-3)}

/* 文件屏 */
.frow{
  display:flex;align-items:center;gap:13px;padding:12px 16px;
  border-bottom:1px solid rgba(0,0,0,.05);
}
.frow:first-child{border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.frow:last-child{border-bottom:none;border-radius:0 0 var(--radius-xl) var(--radius-xl)}
.frow .n{flex:1;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .s{font-size:12px;color:var(--text-3)}

/* 上传屏 */
.up-card{padding:20px;margin-bottom:14px}
.progress{height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#3ea0ff,#0a6cf0);transition:width .25s var(--spring)}
.fab{
  position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;z-index:4;
  background:linear-gradient(180deg,#2f96ff,#0a6cf0);color:#fff;font-size:27px;line-height:1;
  box-shadow:0 12px 26px -6px rgba(10,108,240,.6),inset 0 1px 0 rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
}

#toasts{position:absolute;top:56px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
.toast{
  animation:toastIn .34s var(--spring);
  background:rgba(28,28,32,.9);color:#fff;font-size:12.5px;padding:9px 17px;border-radius:var(--radius-pill);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  display:flex;gap:7px;align-items:center;max-width:86%;
}
.toast .dot{width:6px;height:6px;border-radius:50%;background:#ffd60a;flex:none}

.demoswitch{font-size:13px;color:rgba(245,245,247,.5)}
.demoswitch a{color:#7db9ff;text-decoration:none}
</style>
</head>
<body>

<div class="intro">
  <h1>workstation · Android App<span class="badge-later">后续阶段（SPEC §5）</span></h1>
  <p>核心场景：把手机上的文件传到电脑（SPEC §2 场景 B）。示例数据，未接后端。</p>
</div>

<div class="phone">
  <div class="screen-box">
    <div class="screen-bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="notch"></div>
    <div id="scr"></div>
    <div id="toasts"></div>
  </div>
</div>

<div class="demoswitch">桌面网页版 Demo：<a href="./index.html">demos/index.html</a></div>

<script>
/* workstation UI Demo — Android App v2（后续阶段可视化，示例数据） */
const $=(s,el=document)=>el.querySelector(s);
function toast(msg){
  const t=document.createElement("div");
  t.className="toast";t.innerHTML='<span class="dot"></span><span></span>';
  t.lastChild.textContent=msg;$("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},2400);
}
const I={
  folder:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3b9eff"/></linearGradient></defs><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.27 1.58.74l.9 1.1c.2.25.5.4.82.4h6.1A2.5 2.5 0 0 1 21 8.74v8.76a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z" fill="url(#fg)"/></svg>',
  image:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c86bfa"/><stop offset="1" stop-color="#8f4de8"/></linearGradient></defs><rect x="3" y="4" width="18" height="16" rx="3" fill="url(#ig)"/><circle cx="9" cy="10" r="1.8" fill="#fff" opacity=".9"/><path d="m5 18 5-5 3.5 3.5L17 15l4 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  video:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs><rect x="3" y="5" width="13" height="14" rx="3" fill="url(#vg)"/><path d="m16.5 10.8 4.5-2.6v7.6l-4.5-2.6v-2.4Z" fill="url(#vg)"/></svg>',
  file:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 2.5h7.2L19 8.3V20A1.5 1.5 0 0 1 17.5 21.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1-1.5Z" fill="#ececf2" stroke="#c7c7cc"/><path d="M13 3v5.5H18.5" fill="#dcdce2"/></svg>',
  logo:'<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2.5" stroke="#fff" stroke-width="1.8"/><path d="M9 20h6M12 16v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  files:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3l1.8 2.2H18A2.5 2.5 0 0 1 20.5 9.2v8.3a2.5 2.5 0 0 1-2.5 2.5H6a2.5 2.5 0 0 1-2.5-2.5V7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  up:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 20h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const SAMPLE=[
  {n:"演示视频.mp4",t:"video",s:"1.8 GB"},
  {n:"旅行照片.jpg",t:"image",s:"5.6 MB"},
  {n:"备份-2026-11.zip",t:"file",s:"4.2 GB"},
  {n:"项目计划.md",t:"file",s:"12 KB"},
];
let screen="login";

function appbar(title){
  return `<div class="appbar"><span class="t">${title}</span><span class="badge-demo">演示</span></div>`;
}
function tabs(on){
  return `<div class="tabbar">
    <button class="${on==="files"?"on":""} pressable" data-go="files">${I.files}<span>电脑文件</span></button>
    <button class="${on==="upload"?"on":""} pressable" data-go="upload">${I.up}<span>上传到电脑</span></button>
  </div>`;
}
function render(){
  const el=$("#scr");
  if(screen==="login"){
    el.innerHTML=`<div class="login screen">
      <div class="logo">${I.logo}</div>
      <h2>连接到你的电脑</h2>
      <p class="h-sub" style="margin-top:6px">workstation · 我的主机</p>
      <input type="password" placeholder="密码" id="pw">
      <button class="btn pressable" id="go">连接</button>
      <div class="note">演示：任意密码均可进入</div>
    </div>`;
    $("#go").onclick=()=>{screen="files";render();};
    $("#pw").addEventListener("keydown",e=>{if(e.key==="Enter"){screen="files";render();}});
    return;
  }
  if(screen==="files"){
    el.innerHTML=appbar("电脑文件")+`<div class="content">
      <p class="h-sub" style="margin:2px 4px 12px">D:\\files（示例）</p>
      <div class="card stagger">${SAMPLE.map((f,i)=>`
        <div class="frow pressable" style="--d:${i*55}ms"><span>${I[f.t]||I.file}</span>
        <span class="n">${f.n}</span><span class="s">${f.s}</span></div>`).join("")}
      </div>
      <p class="h-sub" style="margin:14px 4px 0">点击文件可预览 / 下载（演示中仅提示）</p>
    </div>`+tabs("files")+
    `<button class="fab pressable" id="fab">＋</button>`;
    el.querySelectorAll(".frow").forEach((r,i)=>r.onclick=()=>toast(`演示模式：预览/下载「${SAMPLE[i].n}」未真实执行`));
    $("#fab").onclick=()=>{screen="upload";render();};
  }
  if(screen==="upload"){
    el.innerHTML=appbar("上传到电脑")+`<div class="content">
      <div class="card up-card">
        <p class="h-sub" style="margin-bottom:14px">选择手机上的文件，传到 D:\\files</p>
        <input type="file" id="pick" style="width:100%">
      </div>
      <div id="queue"></div>
    </div>`+tabs("upload");
    $("#pick").addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f) return;
      const q=$("#queue");
      const item=document.createElement("div");
      item.className="card up-card";
      item.innerHTML=`<div style="display:flex;gap:13px;align-items:center"><span style="flex:none">${I.file}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
        <div class="h-sub">${(f.size/1048576).toFixed(1)} MB → D:\\files</div>
        <div class="progress"><i></i></div>
        <div class="h-sub pct" style="margin-top:7px">0%</div></div></div>`;
      q.prepend(item);
      let p=0;const bar=item.querySelector(".progress>i"),pct=item.querySelector(".pct");
      const timer=setInterval(()=>{
        p=Math.min(100,p+Math.random()*16);
        bar.style.width=p+"%";pct.textContent=Math.floor(p)+"%";
        if(p>=100){clearInterval(timer);pct.textContent="100% · 演示模式：文件未真实上传";}
      },240);
    });
  }
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{screen=b.dataset.go;render();});
}
render();
</script>
</body>
</html>
