<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>workstation — UI Demo（桌面网页）</title>
<style>
:root{
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#9c9ca1;
  --accent:#0a84ff; --accent-deep:#0066d6;
  --danger:#ff453a;
  --line:rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.8);
  --radius-xl:24px; --radius-lg:18px; --radius-md:13px; --radius-pill:980px;
  --spring:cubic-bezier(.32,.72,0,1);
  --shadow-card:0 0.5px 1px rgba(0,0,0,.05),0 12px 32px -8px rgba(0,0,0,.1);
  --shadow-lift:0 1px 2px rgba(0,0,0,.06),0 20px 48px -12px rgba(0,0,0,.18);
  --shadow-sheet:0 24px 80px -12px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:#f2f2f7;min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
::selection{background:rgba(10,132,255,.2)}

/* ---------- 极光背景（纯 CSS，自绘，不使用任何外部素材） ---------- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f2f2f7}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-20vw;background:radial-gradient(circle,#a6c9ff,transparent 65%)}
.aurora i:nth-child(2){width:44vw;height:44vw;right:-12vw;top:-8vw;background:radial-gradient(circle,#d8ccff,transparent 65%)}
.aurora i:nth-child(3){width:40vw;height:40vw;left:22vw;bottom:-24vw;background:radial-gradient(circle,#ffd9ec,transparent 65%)}
@media (prefers-reduced-motion:no-preference){
  .aurora i:nth-child(1){animation:drift1 26s ease-in-out infinite alternate}
  .aurora i:nth-child(2){animation:drift2 32s ease-in-out infinite alternate}
  .aurora i:nth-child(3){animation:drift3 38s ease-in-out infinite alternate}
}
@keyframes drift1{to{transform:translate(6vw,5vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(-5vw,7vh) scale(1.05)}}
@keyframes drift3{to{transform:translate(-6vw,-4vh) scale(1.1)}}

/* ---------- 动画 ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.page{animation:fadeUp .45s var(--spring)}
.stagger>*{opacity:0;animation:fadeUp .5s var(--spring) forwards;animation-delay:var(--d,0ms)}
.sheet{animation:sheetIn .38s var(--spring)}
.backdrop{animation:fadeIn .22s ease}
.toast{animation:toastIn .34s var(--spring)}
.pressable{transition:transform .22s var(--spring),box-shadow .25s ease}
.pressable:active{transform:scale(.965)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- 骨架：侧边栏 + 内容 ---------- */
#app{min-height:100vh}
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;padding:26px 14px;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 12px 22px}
.brand .mark{
  width:34px;height:34px;border-radius:9.5px;flex:none;
  background:linear-gradient(145deg,#3ea0ff,#0a5fff 55%,#5e5ce6);
  box-shadow:0 6px 16px -4px rgba(10,102,255,.5),inset 0 1px 1px rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
}
.brand b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.brand .badge-demo{margin-left:auto}
.side-link{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;
  color:var(--text-2);text-decoration:none;font-size:14px;font-weight:500;
  transition:background .18s ease,color .18s ease;
}
.side-link svg{opacity:.75}
.side-link:hover{background:rgba(0,0,0,.05);color:var(--text)}
.side-link.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px -4px rgba(0,0,0,.08)}
.side-link.active svg{opacity:1;color:var(--accent)}
.side-foot{margin-top:auto;padding:10px 12px;font-size:11.5px;color:var(--text-3);line-height:1.5}
.main{padding:44px 48px 110px;max-width:1120px}
@media (max-width:900px){.main{padding:34px 22px 110px}}

/* ---------- 字级 ---------- */
.h-large{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.h-title{font-size:21px;font-weight:700;letter-spacing:-.015em}
.h-sub{font-size:14px;color:var(--text-2)}
@media (max-width:640px){.h-large{font-size:30px}}

/* ---------- 组件 ---------- */
.card{
  background:var(--glass-strong);
  -webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-card);border:1px solid rgba(255,255,255,.7);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#2f96ff,#0a6cf0);color:#fff;font-weight:600;font-size:14px;
  padding:9px 20px;border-radius:var(--radius-pill);
  box-shadow:0 4px 14px -4px rgba(10,108,240,.55),inset 0 1px 0 rgba(255,255,255,.25);
  transition:filter .2s ease,transform .22s var(--spring),box-shadow .25s ease;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.96)}
.btn.secondary{
  background:rgba(255,255,255,.75);color:var(--text);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.btn.secondary:hover{background:#fff}
.btn.danger{background:linear-gradient(180deg,#ff6b61,#f03a30);box-shadow:0 4px 14px -4px rgba(255,69,58,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.small{padding:7px 16px;font-size:13px}
.icon-btn{
  width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:9px;color:var(--text-2);transition:background .18s ease,color .18s ease;
}
.icon-btn:hover{background:rgba(0,0,0,.07);color:var(--text)}
.badge-demo{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;color:#8a6d00;background:rgba(255,243,214,.9);
  border:1px solid rgba(240,223,174,.9);padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;
}
.badge-later{
  font-size:11px;font-weight:600;color:#5e5ce6;background:#eeeaff;
  border:1px solid #d9d3f5;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;
}

/* ---------- 登录页 ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{
  width:100%;max-width:396px;padding:52px 40px 40px;text-align:center;border-radius:28px;
  background:rgba(255,255,255,.66);
  -webkit-backdrop-filter:saturate(180%) blur(32px);backdrop-filter:saturate(180%) blur(32px);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 24px 72px -16px rgba(31,38,135,.22),0 2px 6px rgba(0,0,0,.04);
}
.login-logo{
  width:72px;height:72px;margin:0 auto 22px;border-radius:20px;
  background:linear-gradient(145deg,#3ea0ff,#0a5fff 55%,#5e5ce6);
  box-shadow:0 14px 32px -8px rgba(10,102,255,.55),inset 0 1.5px 2px rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
}
.login-card .h-title{font-size:24px;margin-bottom:8px}
.login-card .h-sub{margin-bottom:30px}
.login-card input{
  width:100%;padding:13px 17px;border-radius:var(--radius-md);border:1px solid var(--line);
  background:rgba(255,255,255,.8);outline:none;font-size:15px;
  transition:border-color .2s,box-shadow .25s ease;
}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 4.5px rgba(10,132,255,.16);background:#fff}
.login-card .btn{width:100%;margin-top:16px;padding:13px;font-size:15px}
.login-note{margin-top:20px;font-size:12px;color:var(--text-3)}

/* ---------- 文件页 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin:22px 0 16px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:2px;font-size:14px;flex-wrap:wrap}
.crumbs button{color:var(--text-2);padding:5px 9px;border-radius:8px;font-weight:500;transition:background .18s,color .18s}
.crumbs button:hover{background:rgba(0,0,0,.06);color:var(--text)}
.crumbs button:last-child{color:var(--text);font-weight:650}
.crumbs .sep{color:var(--text-3);font-weight:300}
.toolbar .spacer{flex:1}
.file-list{overflow:hidden;padding:6px}
.file-row{
  display:grid;grid-template-columns:46px 1fr 110px 150px auto;align-items:center;gap:12px;
  padding:9px 14px;border-radius:14px;cursor:pointer;
  transition:background .16s ease,transform .2s var(--spring);
}
.file-row:hover{background:rgba(255,255,255,.85)}
.file-row .fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .meta{font-size:12.5px;color:var(--text-3);text-align:right}
.file-row .actions{display:flex;gap:2px;opacity:0;transition:opacity .18s ease}
.file-row:hover .actions{opacity:1}
@media (max-width:720px){
  .file-row{grid-template-columns:40px 1fr auto}
  .file-row .meta{display:none}
  .file-row .actions{opacity:1}
}
.empty{padding:60px 24px;text-align:center;color:var(--text-3);font-size:14px}

/* ---------- 弹层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(20,20,30,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.sheet{
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-radius:22px;box-shadow:var(--shadow-sheet);border:1px solid rgba(255,255,255,.7);
  width:100%;max-width:580px;max-height:84vh;overflow:auto;padding:26px 26px 22px;
}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sheet-head .h-title{font-size:17.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:20px}
.preview-body{border-radius:var(--radius-lg);overflow:hidden;background:#0b0b10;min-height:200px;display:flex;align-items:center;justify-content:center}
.preview-body.text{background:rgba(0,0,0,.03);border:1px solid var(--line)}
.preview-body pre{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
  padding:20px;white-space:pre-wrap;color:var(--text);width:100%;line-height:1.6;
}
.video-fake{position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 140% at 20% 10%,#3a3f5c 0%,#14141d 60%,#0b0b10 100%)}
.play-ring{
  width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:transform .25s var(--spring);
}
.video-fake:hover .play-ring{transform:scale(1.08)}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.field input{
  width:100%;padding:11px 15px;border-radius:var(--radius-md);border:1px solid var(--line);
  background:rgba(255,255,255,.8);outline:none;transition:border-color .2s,box-shadow .25s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4.5px rgba(10,132,255,.16)}
.progress{height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#3ea0ff,#0a6cf0);transition:width .25s var(--spring)}

/* ---------- 连接页 ---------- */
.connect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px}
.connect-card{
  padding:28px;display:flex;flex-direction:column;gap:13px;border-radius:var(--radius-xl);
  transition:transform .3s var(--spring),box-shadow .3s ease;
}
.connect-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.connect-card .ic{
  width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.35);
}
.ic.blue{background:linear-gradient(145deg,#4da3ff,#0a5fff)}
.ic.purple{background:linear-gradient(145deg,#8f7bff,#5e5ce6)}
.ic.orange{background:linear-gradient(145deg,#ffb340,#ff8a00)}
.connect-card .desc{font-size:14px;color:var(--text-2);flex:1}
.action-row{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.75);border:1px solid var(--line);
}
.action-row .n{font-weight:600;font-size:14px}
.action-row .c{font-size:12px;color:var(--text-3);font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 设置页 ---------- */
.settings-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.settings-empty{margin-top:14px;padding:26px;text-align:center;color:var(--text-3);font-size:14px;
  background:rgba(255,255,255,.6);border-radius:var(--radius-lg);border:1px dashed var(--line)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:rgba(28,28,32,.88);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:var(--radius-pill);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 12px 32px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;max-width:88vw;
  border:1px solid rgba(255,255,255,.12);
}
.toast .dot{width:7px;height:7px;border-radius:50%;background:#ffd60a;flex:none}

/* ---------- 移动端：底部标签栏 ---------- */
.tabbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .tabbar{
    display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;border-radius:22px;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
    border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 32px -8px rgba(0,0,0,.18);
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  }
  .tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    text-decoration:none;color:var(--text-3);font-size:10.5px;font-weight:500;padding:6px 0;border-radius:14px;
  }
  .tabbar a.active{color:var(--accent)}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="toasts"></div>

<script>
/* =========================================================
 * workstation UI Demo — 桌面网页 v2（示例数据，无真实后端）
 * 未接通的行为点击后只显示「演示」提示，不伪造成功。
 * ========================================================= */
const FILE_TREE = {
  "此电脑": { type:"dir", children:{
    "C:": { type:"dir", children:{
      "Users": { type:"dir", children:{
        "Evan": { type:"dir", children:{
          "Documents": { type:"dir", children:{
            "项目计划.md": { type:"text", size:"12 KB", mtime:"2026-11-20 14:32" },
            "设计参考": { type:"dir", children:{
              "hero-concept.png": { type:"image", size:"2.4 MB", mtime:"2026-11-18 09:15" },
            }},
          }},
          "Pictures": { type:"dir", children:{
            "桌面壁纸.heic": { type:"image", size:"3.1 MB", mtime:"2026-10-02 18:44" },
          }},
        }},
      }},
    }},
    "D:": { type:"dir", children:{
      "files": { type:"dir", children:{
        "演示视频.mp4": { type:"video", size:"1.8 GB", mtime:"2026-11-10 21:07" },
        "备份-2026-11.zip": { type:"file", size:"4.2 GB", mtime:"2026-11-01 03:00" },
        "旅行照片.jpg": { type:"image", size:"5.6 MB", mtime:"2026-09-27 16:20" },
        "README.txt": { type:"text", size:"2 KB", mtime:"2026-11-12 11:05" },
      }},
    }},
  }},
};
const SAMPLE_TEXT = "# workstation\n\n个人工作站：文件、连接、应用。\n\n这是文本预览的示例内容。\n实际内容将来自你的电脑。";

const store = {
  get actions(){ try{ return JSON.parse(localStorage.getItem("ws-actions")||"null") ?? [{n:"打开 VS Code (WSL)",c:"wsl code ~/projects"}]; }catch{ return []; } },
  set actions(v){ localStorage.setItem("ws-actions", JSON.stringify(v)); },
};

const $ = (s,el=document)=>el.querySelector(s);
function toast(msg){
  const t=document.createElement("div");
  t.className="toast"; t.innerHTML='<span class="dot"></span><span></span>';
  t.lastChild.textContent=msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(6px)";t.style.transition="all .3s";setTimeout(()=>t.remove(),320);},2600);
}
function demoToast(what){ toast(`演示模式：${what} 未真实执行（未接后端）`); }
function nodeAt(path){
  let node={type:"dir",children:FILE_TREE};
  for(const seg of path){ node=node.children?.[seg]; if(!node) break; }
  return node||{type:"dir",children:{}};
}

/* ---------- 自绘 SVG 图标（不使用 Apple SF Symbols） ---------- */
const I = {
  folder:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3b9eff"/></linearGradient></defs><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.27 1.58.74l.9 1.1c.2.25.5.4.82.4h6.1A2.5 2.5 0 0 1 21 8.74v8.76a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z" fill="url(#fg)"/></svg>',
  file:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 2.5h7.2L19 8.3V20A1.5 1.5 0 0 1 17.5 21.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1-1.5Z" fill="#ececf2" stroke="#c7c7cc"/><path d="M13 3v5.5H18.5" fill="#dcdce2"/></svg>',
  image:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c86bfa"/><stop offset="1" stop-color="#8f4de8"/></linearGradient></defs><rect x="3" y="4" width="18" height="16" rx="3" fill="url(#ig)"/><circle cx="9" cy="10" r="1.8" fill="#fff" opacity=".9"/><path d="m5 18 5-5 3.5 3.5L17 15l4 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  video:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs><rect x="3" y="5" width="13" height="14" rx="3" fill="url(#vg)"/><path d="m16.5 10.8 4.5-2.6v7.6l-4.5-2.6v-2.4Z" fill="url(#vg)"/></svg>',
  text:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="2.5" width="14" height="19" rx="2.5" fill="#ececf2" stroke="#c7c7cc"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round"/></svg>',
  desktop:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="12.5" rx="2.5" stroke="#fff" stroke-width="1.7"/><path d="M9 20.5h6M12 16.5v4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>',
  code:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="m8.5 7-5 5 5 5M15.5 7l5 5-5 5" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bolt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2.5 4.5 13.5H11L10 21.5l9-11H13l1-8Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  boltSm:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2.5 4.5 13.5H11L10 21.5l9-11H13l1-8Z" stroke="#0a84ff" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  rename:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="m14.5 5 4.5 4.5L8 18.5l-5 1 1-5L14.5 5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  download:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4.5 6.5h15M9.5 4h5M8 6.5V20a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7"/><path d="M19.5 12a7.6 7.6 0 0 0-.1-1.2l2-1.5-2-3.5-2.3 1a7.7 7.7 0 0 0-2.1-1.2L14.5 3h-5L9 5.6a7.7 7.7 0 0 0-2.1 1.2l-2.3-1-2 3.5 2 1.5a7.7 7.7 0 0 0 0 2.4l-2 1.5 2 3.5 2.3-1a7.7 7.7 0 0 0 2.1 1.2l.5 2.6h5l.5-2.6a7.7 7.7 0 0 0 2.1-1.2l2.3 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  files:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.5 7A2.5 2.5 0 0 1 6 4.5h3l1.8 2.2H18A2.5 2.5 0 0 1 20.5 9.2v8.3a2.5 2.5 0 0 1-2.5 2.5H6a2.5 2.5 0 0 1-2.5-2.5V7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  link:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M10 14a5 5 0 0 0 7.5.5l2.5-2.5a5 5 0 0 0-7-7L11.5 6.5M14 10a5 5 0 0 0-7.5-.5L4 12a5 5 0 0 0 7 7l1.5-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  logo:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2.5" stroke="#fff" stroke-width="1.8"/><path d="M9 20h6M12 16v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
};
function iconFor(node){
  if(node.type==="dir") return I.folder;
  if(node.type==="image") return I.image;
  if(node.type==="video") return I.video;
  if(node.type==="text") return I.text;
  return I.file;
}

/* ---------- 路由 ---------- */
const routes=["login","files","connect","settings"];
let state={ path:["此电脑"] };
function route(){
  const h=(location.hash||"#/login").replace("#/","");
  return routes.includes(h)?h:"login";
}
function render(){
  const r=route();
  const app=$("#app");
  if(r==="login"){ app.innerHTML=viewLogin(); bindLogin(); return; }
  app.innerHTML=shell(r)+tabbar(r);
  const page=$("#page");
  if(r==="files"){ page.innerHTML=viewFiles(); bindFiles(); }
  if(r==="connect"){ page.innerHTML=viewConnect(); bindConnect(); }
  if(r==="settings"){ page.innerHTML=viewSettings(); bindSettings(); }
}
function shell(active){
  const link=(id,icon,label)=>`<a href="#/${id}" class="side-link ${active===id?"active":""}">${icon}<span>${label}</span></a>`;
  return `<div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="mark">${I.logo}</span><b>workstation</b><span class="badge-demo">UI 演示</span></div>
      ${link("files",I.files,"文件")}
      ${link("connect",I.link,"连接")}
      ${link("settings",I.gear,"设置")}
      <div class="side-foot">示例数据 · 未接后端<br>设计依据：SPEC §4</div>
    </aside>
    <main class="main page" id="page"></main>
  </div>`;
}
function tabbar(active){
  const link=(id,icon,label)=>`<a href="#/${id}" class="${active===id?"active":""}">${icon}<span>${label}</span></a>`;
  return `<nav class="tabbar">${link("files",I.files,"文件")}${link("connect",I.link,"连接")}${link("settings",I.gear,"设置")}</nav>`;
}

/* ---------- 登录页 ---------- */
function viewLogin(){
  return `<div class="login-wrap"><div class="login-card page">
    <div class="login-logo">${I.logo}</div>
    <div class="h-title">连接到你的电脑</div>
    <div class="h-sub">所有功能均需身份验证（SPEC §4.4）</div>
    <input id="pw" type="password" placeholder="密码" autocomplete="off">
    <button class="btn pressable" id="loginBtn">登录</button>
    <div class="login-note">演示：任意密码均可进入；真实认证机制待定（SPEC §8.2）</div>
  </div></div>`;
}
function bindLogin(){
  const go=()=>{ location.hash="#/files"; };
  $("#loginBtn").onclick=go;
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  $("#pw").focus();
}

/* ---------- 文件页 ---------- */
function viewFiles(){
  const node=nodeAt(state.path);
  const crumbs=state.path.map((seg,i)=>
    `${i?'<span class="sep">›</span>':''}<button data-i="${i}">${seg}</button>`).join("");
  const entries=Object.entries(node.children||{});
  const rows=entries.length? `<div class="stagger">`+entries.map(([name,n],i)=>`
    <div class="file-row" data-name="${name}" style="--d:${i*45}ms">
      <span>${iconFor(n)}</span>
      <span class="fname">${name}</span>
      <span class="meta">${n.size||"—"}</span>
      <span class="meta">${n.mtime||"—"}</span>
      <span class="actions">
        ${n.type!=="dir"?`<button class="icon-btn" data-act="rename" title="重命名">${I.rename}</button>
        <button class="icon-btn" data-act="download" title="下载">${I.download}</button>`:""}
        <button class="icon-btn" data-act="delete" title="删除">${I.trash}</button>
      </span>
    </div>`).join("")+`</div>` : `<div class="empty">空文件夹</div>`;
  return `
    <div class="h-large">文件</div>
    <div class="h-sub" style="margin-top:6px">整台电脑的文件系统（SPEC §4.1）· 示例数据</div>
    <div class="toolbar">
      <div class="crumbs">${crumbs}</div>
      <div class="spacer"></div>
      <button class="btn secondary small pressable" id="newFolder">新建文件夹</button>
      <button class="btn small pressable" id="upload">上传</button>
    </div>
    <div class="card file-list">${rows}</div>`;
}
function bindFiles(){
  document.querySelectorAll(".crumbs button").forEach(b=>{
    b.onclick=()=>{ state.path=state.path.slice(0,+b.dataset.i+1); render(); };
  });
  document.querySelectorAll(".file-row").forEach(row=>{
    const name=row.dataset.name;
    const node=nodeAt(state.path).children[name];
    row.onclick=e=>{
      if(e.target.closest("[data-act]")) return;
      if(node.type==="dir"){ state.path=[...state.path,name]; render(); }
      else openPreview(name,node);
    };
    row.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick=()=>{
        const act=btn.dataset.act;
        if(act==="rename") openRename(name);
        if(act==="download") demoToast(`下载「${name}」`);
        if(act==="delete") openDelete(name);
      };
    });
  });
  $("#upload").onclick=openUpload;
  $("#newFolder").onclick=()=>openPromptSheet("新建文件夹","文件夹名称",name=>{
    demoToast(`创建文件夹「${name}」（示例列表不持久保存）`);
  });
}

/* ---------- 弹层 ---------- */
function openSheet(html){
  const ov=document.createElement("div");
  ov.className="overlay backdrop";
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.addEventListener("keydown",function esc(e){ if(e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown",esc);} });
  return ov;
}
function openPromptSheet(title,label,onOk){
  const ov=openSheet(`
    <div class="sheet-head"><div class="h-title">${title}</div></div>
    <div class="field"><label>${label}</label><input id="ps-input" autocomplete="off"></div>
    <div class="foot"><button class="btn secondary pressable" id="ps-cancel">取消</button>
    <button class="btn pressable" id="ps-ok">确定</button></div>`);
  const input=ov.querySelector("#ps-input"); input.focus();
  const ok=()=>{ const v=input.value.trim(); if(v){ onOk(v); ov.remove(); } };
  ov.querySelector("#ps-ok").onclick=ok;
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") ok(); });
  ov.querySelector("#ps-cancel").onclick=()=>ov.remove();
}
function openRename(name){
  openPromptSheet("重命名","新名称（当前："+name+"）",v=>demoToast(`重命名为「${v}」`));
}
function openDelete(name){
  const ov=openSheet(`
    <div class="sheet-head"><div class="h-title">删除「${name}」？</div></div>
    <p class="h-sub">此操作在真实版本中不可恢复。</p>
    <div class="foot"><button class="btn secondary pressable" id="d-cancel">取消</button>
    <button class="btn danger pressable" id="d-ok">删除</button></div>`);
  ov.querySelector("#d-cancel").onclick=()=>ov.remove();
  ov.querySelector("#d-ok").onclick=()=>{ demoToast(`删除「${name}」`); ov.remove(); };
}
function openPreview(name,node){
  let body="";
  if(node.type==="image"){
    body=`<div class="preview-body"><svg width="100%" height="320" viewBox="0 0 560 320" preserveAspectRatio="none">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ea0ff"/><stop offset=".5" stop-color="#5e5ce6"/><stop offset="1" stop-color="#c86bfa"/></linearGradient></defs>
      <rect width="560" height="320" fill="url(#g)"/>
      <text x="280" y="165" text-anchor="middle" fill="rgba(255,255,255,.9)" font-size="15">示例图片占位（真实内容来自你的电脑）</text></svg></div>`;
  }else if(node.type==="video"){
    body=`<div class="preview-body"><div class="video-fake"><div class="play-ring">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg></div></div></div>`;
  }else if(node.type==="text"){
    body=`<div class="preview-body text"><pre>${SAMPLE_TEXT}</pre></div>`;
  }else{
    body=`<div class="preview-body text"><div style="padding:44px;color:var(--text-3)">此文件类型暂不支持预览</div></div>`;
  }
  const ov=openSheet(`
    <div class="sheet-head"><div class="h-title">${name}</div>
    <button class="icon-btn pressable" id="p-close" title="关闭">✕</button></div>
    ${body}
    <div class="foot"><span class="badge-demo">演示：预览内容为占位数据</span></div>`);
  ov.querySelector("#p-close").onclick=()=>ov.remove();
}
function openUpload(){
  const ov=openSheet(`
    <div class="sheet-head"><div class="h-title">上传到 ${state.path.join(" / ")}</div></div>
    <div class="field"><label>选择文件（演示：任意文件，不会真实上传）</label>
    <input type="file" id="up-file"></div>
    <div id="up-area" style="display:none">
      <div class="h-sub" id="up-name"></div>
      <div class="progress"><i id="up-bar"></i></div>
      <div class="h-sub" id="up-pct" style="margin-top:7px">0%</div>
    </div>
    <div class="foot"><button class="btn secondary pressable" id="up-close">关闭</button></div>`);
  ov.querySelector("#up-close").onclick=()=>ov.remove();
  ov.querySelector("#up-file").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    ov.querySelector("#up-area").style.display="block";
    ov.querySelector("#up-name").textContent=f.name+"（"+(f.size/1048576).toFixed(1)+" MB）";
    let p=0; const bar=ov.querySelector("#up-bar"),pct=ov.querySelector("#up-pct");
    const timer=setInterval(()=>{
      p=Math.min(100,p+Math.random()*14);
      bar.style.width=p+"%"; pct.textContent=Math.floor(p)+"%";
      if(p>=100){ clearInterval(timer); pct.textContent="100% · 演示模式：文件未真实上传"; }
    },220);
  });
}

/* ---------- 连接页 ---------- */
function viewConnect(){
  const acts=store.actions;
  const actRows=acts.length?acts.map((a,i)=>`
    <div class="action-row">
      <span>${I.boltSm}</span>
      <div style="flex:1;min-width:0"><div class="n">${a.n}</div><div class="c">${a.c}</div></div>
      <button class="btn secondary small pressable" data-run="${i}">执行</button>
    </div>`).join(""):`<div class="settings-empty">未配置预设动作时，默认进入远程桌面（SPEC §4.2c）</div>`;
  return `
    <div class="h-large">连接</div>
    <div class="h-sub" style="margin-top:6px">连接到这台电脑与其应用（SPEC §4.2 / §4.3）</div>
    <div class="connect-grid stagger">
      <div class="card connect-card" style="--d:0ms">
        <span class="ic blue">${I.desktop}</span>
        <div class="h-title">远程桌面</div>
        <div class="desc">通过 RDP 连上这台电脑的桌面。实现方式待定（SPEC §8.3）。</div>
        <div><button class="btn pressable" id="rdp">连接桌面</button></div>
      </div>
      <div class="card connect-card" style="--d:60ms">
        <span class="ic purple">${I.code}</span>
        <div class="h-title">VS Code (WSL)</div>
        <div class="desc">通过 vscode:// 深链唤起<strong>当前这台设备</strong>上的 VS Code 并打开 WSL 环境。</div>
        <div><button class="btn secondary pressable" id="vscode">在当前设备打开</button></div>
      </div>
      <div class="card connect-card" style="--d:120ms">
        <span class="ic orange">${I.bolt}</span>
        <div class="h-title">预设动作</div>
        <div class="desc">在设置页配置的动作，一键触发。</div>
        <div class="settings-list" style="margin-top:0">${actRows}</div>
      </div>
    </div>`;
}
function bindConnect(){
  $("#rdp").onclick=()=>demoToast("将按 §8.3 所选方式发起远程桌面（如下载 .rdp）");
  $("#vscode").onclick=()=>{
    toast("正在尝试唤起本机 VS Code（vscode:// 深链）…");
    const a=document.createElement("a"); a.href="vscode://vscode-remote/wsl"; a.click();
  };
  document.querySelectorAll("[data-run]").forEach(b=>{
    b.onclick=()=>demoToast(`执行预设动作「${store.actions[+b.dataset.run].n}」`);
  });
}

/* ---------- 设置页 ---------- */
function viewSettings(){
  const acts=store.actions;
  const rows=acts.length?acts.map((a,i)=>`
    <div class="action-row">
      <span>${I.boltSm}</span>
      <div style="flex:1;min-width:0"><div class="n">${a.n}</div><div class="c">${a.c}</div></div>
      <button class="icon-btn" data-del="${i}" title="删除">${I.trash}</button>
    </div>`).join(""):`<div class="settings-empty">还没有预设动作</div>`;
  return `
    <div class="h-large">设置</div>
    <div class="h-sub" style="margin-top:6px">预设动作配置（SPEC §4.2c）· 保存在本浏览器，仅作演示</div>
    <div class="card" style="margin-top:22px;padding:26px">
      <div class="h-title" style="font-size:16.5px;margin-bottom:16px">新增预设动作</div>
      <div class="field"><label>名称</label><input id="af-name" placeholder="例如：打开 VS Code (WSL)"></div>
      <div class="field"><label>命令</label><input id="af-cmd" placeholder="例如：wsl code ~/projects"></div>
      <button class="btn pressable" id="af-add">添加</button>
      <div class="h-sub" style="margin-top:14px">安全边界（任意命令 vs 白名单）待定：SPEC §8.4</div>
    </div>
    <div class="h-title" style="font-size:16.5px;margin-top:28px">已配置（${acts.length}）</div>
    <div class="settings-list">${rows}</div>`;
}
function bindSettings(){
  $("#af-add").onclick=()=>{
    const n=$("#af-name").value.trim(), c=$("#af-cmd").value.trim();
    if(!n||!c){ toast("请填写名称和命令"); return; }
    store.actions=[...store.actions,{n,c}];
    toast("已添加（仅本浏览器）"); render();
  };
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{
      const acts=store.actions; acts.splice(+b.dataset.del,1); store.actions=acts; render();
    };
  });
}

window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
